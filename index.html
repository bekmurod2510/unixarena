<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UnixArena</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0d1117;
        overflow: hidden;
      }
      /* Hide the terminal's scrollbar; the mouse wheel still scrolls the history. */
      .xterm .xterm-scrollable-element > .scrollbar {
        display: none !important;
      }
      .xterm .xterm-viewport {
        scrollbar-width: none;
      }
      .xterm .xterm-viewport::-webkit-scrollbar {
        display: none;
      }
      #terminal {
        height: 100%;
        padding: 8px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="terminal"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
